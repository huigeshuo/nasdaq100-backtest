<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纳斯达克 100 ETF 定投回测</title>
<style>
:root {
  --bg: #f5f5f5;
  --card: #ffffff;
  --sidebar-bg: #1e1e2f;
  --sidebar-text: #e0e0e0;
  --primary: #2962FF;
  --green: #00c853;
  --red: #ff1744;
  --text: #212121;
  --text-secondary: #757575;
  --border: #e0e0e0;
  --radius: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0f2f6;
  color: var(--text);
  display: flex;
  min-height: 100vh;
}

/* ---- Sidebar ---- */
.sidebar {
  width: 320px;
  min-width: 320px;
  background: var(--sidebar-bg);
  color: var(--sidebar-text);
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.sidebar h2 {
  font-size: 18px;
  font-weight: 600;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.sidebar label {
  font-size: 13px;
  font-weight: 500;
  color: #bbb;
  margin-bottom: 4px;
  display: block;
}
.sidebar input, .sidebar select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  background: rgba(255,255,255,0.08);
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: border 0.2s;
}
.sidebar input:focus, .sidebar select:focus {
  border-color: var(--primary);
}
.sidebar .row { display: flex; gap: 12px; }
.sidebar .row > div { flex: 1; }
.sidebar select { cursor: pointer; }
.sidebar select option { background: #1e1e2f; color: #fff; }
.sidebar .btn {
  width: 100%;
  padding: 12px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
}
.sidebar .btn:hover { background: #1e4fdb; }
.sidebar .btn:active { transform: scale(0.98); }
.sidebar .caption {
  font-size: 11px;
  color: #888;
  line-height: 1.6;
}

/* ---- Main ---- */
.main {
  flex: 1;
  padding: 28px 32px;
  overflow-y: auto;
  max-height: 100vh;
}
.main h1 {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 4px;
}
.main > .subtitle {
  color: var(--text-secondary);
  font-size: 13px;
  margin-bottom: 24px;
}

/* ---- KPI Cards ---- */
.kpi-row {
  display: flex;
  gap: 14px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.kpi-card {
  flex: 1;
  min-width: 150px;
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.kpi-card .kpi-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.kpi-card .kpi-value { font-size: 22px; font-weight: 700; }
.kpi-card .kpi-delta { font-size: 13px; margin-top: 2px; }
.kpi-card .kpi-delta.positive { color: var(--green); }
.kpi-card .kpi-delta.negative { color: var(--red); }

/* ---- Chart ---- */
.chart-container {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  margin-bottom: 24px;
  padding: 4px 0 0 0;
}
.chart-container h3 {
  font-size: 15px;
  font-weight: 600;
  padding: 16px 20px 0 20px;
}

/* ---- Tables ---- */
.table-container {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  margin-bottom: 24px;
}
.table-container h3 {
  font-size: 15px;
  font-weight: 600;
  padding: 16px 20px 0 20px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
thead th {
  background: #f8f9fa;
  padding: 10px 14px;
  text-align: right;
  font-weight: 600;
  color: #555;
  border-bottom: 2px solid #eee;
  position: sticky;
  top: 0;
}
thead th:first-child { text-align: center; }
tbody td {
  padding: 8px 14px;
  text-align: right;
  border-bottom: 1px solid #f0f0f0;
}
tbody td:first-child { text-align: center; font-weight: 500; }
tbody tr:hover { background: #f8f9ff; }

/* ---- Expandable ---- */
details { padding: 0 20px 16px 20px; }
details summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--primary);
  font-weight: 500;
  padding: 8px 0;
  user-select: none;
}

/* ---- Initial state ---- */
.placeholder {
  background: var(--card);
  border-radius: var(--radius);
  padding: 60px 20px;
  text-align: center;
  color: var(--text-secondary);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.placeholder .icon { font-size: 48px; margin-bottom: 12px; }
.placeholder p { font-size: 14px; line-height: 1.8; }

/* ---- Responsive ---- */
@media (max-width: 900px) {
  body { flex-direction: column; }
  .sidebar {
    width: 100%; min-width: unset;
    padding: 16px;
    gap: 12px;
    position: sticky; top: 0; z-index: 10;
  }
  .sidebar h2 { font-size: 16px; padding-bottom: 8px; }
  .sidebar label { font-size: 12px; }
  .sidebar input, .sidebar select { padding: 8px 10px; font-size: 16px; }
  .main {
    max-height: none;
    padding: 16px 12px;
  }
  .main h1 { font-size: 18px; }
  .main > .subtitle { font-size: 12px; }
  .kpi-row { gap: 8px; }
  .kpi-card {
    min-width: calc(50% - 8px);
    padding: 12px 14px;
  }
  .kpi-card .kpi-value { font-size: 17px; }
  .chart-container div canvas { height: 280px !important; }
  table { font-size: 11px; }
  thead th, tbody td { padding: 6px 8px; }
}

.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(0,0,0,0.15);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin-right: 6px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

.section-divider {
  border: none;
  border-top: 1px solid #eee;
  margin: 20px 0;
}
</style>
</head>
<body>

<!-- ════ SIDEBAR ════ -->
<div class="sidebar">
  <h2>📋 回测参数</h2>

  <div>
    <label>底仓金额（元）</label>
    <input type="number" id="baseAmount" value="100000" min="0" step="10000">
  </div>

  <div>
    <label>每月定投金额（元）</label>
    <input type="number" id="monthlyAmount" value="1000" min="0" step="500">
  </div>

  <div class="row">
    <div>
      <label>起始年份</label>
      <select id="startYear"></select>
    </div>
    <div>
      <label>结束年份</label>
      <select id="endYear"></select>
    </div>
  </div>

  <button class="btn" onclick="run()">🚀 开始回测</button>

  <div class="caption">
    数据范围：<span id="dataRange"></span><br>
    （QQQ 前复权日线）
  </div>
</div>

<!-- ════ MAIN ════ -->
<div class="main" id="mainContent">
  <h1>📈 纳斯达克 100 ETF 定投回测</h1>
  <div class="subtitle">策略：底仓 + 每月固定金额定投 · 整数股交易 · QQQ 历史数据（前复权）</div>

  <div class="placeholder" id="placeholder">
    <div class="icon">👈</div>
    <p>在左侧设置参数后，点击「开始回测」按钮查看结果。</p>
    <p style="margin-top:12px; color:#999;">
      <strong>策略说明</strong><br>
      · 底仓 + 月定投：先一次性投入底仓资金，之后每月固定金额买入<br>
      · 整数股交易：当月资金不足 1 股时，现金累积到下月<br>
      · 数据范围：QQQ 前复权日线（2001–2026）
    </p>
  </div>

  <div id="results" style="display:none;"></div>
</div>

<!-- ════ BACKTEST ENGINE ════ -->
<script>
// Parse data
const allData = PRICE_DATA.map(d => ({
  month: d[0],
  open: d[1],
  close: d[2],
  year: parseInt(d[0].slice(0,4))
}));

const minYear = allData[0].year;
const maxYear = allData[allData.length - 1].year;

// Populate year selectors
function initUI() {
  const startEl = document.getElementById('startYear');
  const endEl = document.getElementById('endYear');
  for (let y = minYear; y <= maxYear; y++) {
    const opt1 = document.createElement('option');
    opt1.value = y; opt1.textContent = y + ' 年';
    startEl.appendChild(opt1);
    const opt2 = document.createElement('option');
    opt2.value = y; opt2.textContent = y + ' 年';
    endEl.appendChild(opt2);
  }
  endEl.value = maxYear;
  document.getElementById('dataRange').textContent =
    minYear + '年 至 ' + maxYear + '年' + allData[allData.length-1].month.slice(5) + '月';
}

function fmt(n) {
  // Format number with commas, 2 decimals
  if (Math.abs(n) >= 1e6) return n.toLocaleString('en-US', {maximumFractionDigits:0});
  if (Math.abs(n) >= 1) return n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return n.toFixed(4);
}

function fmtPct(n) {
  return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
}

function runBacktest(baseAmount, monthlyAmount, data) {
  let cash = baseAmount;
  let shares = 0;
  let totalInvested = baseAmount;
  const monthly = [];
  const transactions = [];

  for (const row of data) {
    cash += monthlyAmount;
    totalInvested += monthlyAmount;

    // Buy integer shares at open price
    if (row.open > 0 && cash >= row.open) {
      const buyable = Math.floor(cash / row.open);
      if (buyable > 0) {
        const cost = buyable * row.open;
        shares += buyable;
        cash -= cost;
        transactions.push({
          month: row.month,
          price: row.open,
          shares: buyable,
          amount: cost
        });
      }
    }

    // End-of-month portfolio value
    const portfolioValue = shares * row.close + cash;
    monthly.push({
      month: row.month,
      open: row.open,
      close: row.close,
      shares: shares,
      cash: cash,
      portfolioValue: portfolioValue,
      totalInvested: totalInvested
    });
  }

  // Summary
  const last = monthly[monthly.length - 1];
  const totalProfit = last.portfolioValue - totalInvested;
  const totalReturnPct = totalInvested > 0 ? (totalProfit / totalInvested) * 100 : 0;

  const years = data.length / 12;
  const cagr = totalInvested > 0 && years > 0
    ? (Math.pow(last.portfolioValue / totalInvested, 1 / years) - 1) * 100
    : 0;

  // Max drawdown
  let peak = -Infinity;
  let maxDD = 0;
  for (const m of monthly) {
    if (m.portfolioValue > peak) peak = m.portfolioValue;
    const dd = (m.portfolioValue - peak) / peak;
    if (dd < maxDD) maxDD = dd;
  }

  // Annual summary
  const annualMap = {};
  let firstYearDone = false;
  const uniqueYears = [...new Set(data.map(d => d.year))];

  for (const year of uniqueYears) {
    const yearMonths = monthly.filter(m => m.month.startsWith(String(year)));
    if (yearMonths.length === 0) continue;

    let yearInvested = monthlyAmount * yearMonths.length;
    if (!firstYearDone) {
      yearInvested += baseAmount;
      firstYearDone = true;
    }

    annualMap[year] = {
      year: year,
      yearInvested: yearInvested,
      cumInvested: yearMonths[yearMonths.length - 1].totalInvested,
      yearEndValue: yearMonths[yearMonths.length - 1].portfolioValue
    };
  }

  // Calculate year-over-year change
  const annual = Object.values(annualMap).sort((a, b) => a.year - b.year);
  let prevYearValue = 0;
  for (let i = 0; i < annual.length; i++) {
    if (i === 0) {
      annual[i].change = annual[i].yearEndValue - annual[i].cumInvested;
    } else {
      annual[i].change = annual[i].yearEndValue - annual[i - 1].yearEndValue;
    }
  }

  return {
    summary: {
      totalInvested: totalInvested,
      finalValue: last.portfolioValue,
      totalProfit: totalProfit,
      totalReturnPct: totalReturnPct,
      cagrPct: cagr,
      maxDrawdownPct: maxDD * 100,
      years: years,
      finalShares: shares,
      finalCash: cash
    },
    annual: annual,
    transactions: transactions,
    monthly: monthly
  };
}

function run() {
  const baseAmount = parseFloat(document.getElementById('baseAmount').value) || 0;
  const monthlyAmount = parseFloat(document.getElementById('monthlyAmount').value) || 0;
  const startYear = parseInt(document.getElementById('startYear').value);
  const endYear = parseInt(document.getElementById('endYear').value);

  // Filter data
  const filtered = allData.filter(d => d.year >= startYear && d.year <= endYear);
  if (filtered.length === 0) {
    alert('所选时间范围内无可用数据。');
    return;
  }

  // Simulate short spinner
  document.getElementById('placeholder').style.display = 'none';
  const resultsDiv = document.getElementById('results');
  resultsDiv.style.display = 'block';
  resultsDiv.innerHTML = '<div style="text-align:center;padding:40px;"><span class="spinner"></span> 回测计算中...</div>';

  // Use setTimeout to allow UI to update
  setTimeout(() => {
    const result = runBacktest(baseAmount, monthlyAmount, filtered);
    renderResults(result, startYear, endYear);
  }, 50);
}

function renderResults(result, startYear, endYear) {
  const s = result.summary;

  let html = '';

  // ---- KPI Cards ----
  html += '<div class="kpi-row">';
  html += kpiCard('总投入', '¥' + fmt(s.totalInvested));
  html += kpiCard('期末总市值', '¥' + fmt(s.finalValue));
  const profitClass = s.totalProfit >= 0 ? 'positive' : 'negative';
  html += kpiCard('总收益', '¥' + fmt(s.totalProfit), fmtPct(s.totalReturnPct), profitClass);
  html += kpiCard('年化收益率 (CAGR)', fmtPct(s.cagrPct));
  html += kpiCard('最大回撤', fmtPct(s.maxDrawdownPct));
  html += '</div>';

  // ---- Chart ----
  html += '<div class="chart-container"><h3>📈 收益曲线</h3>';
  html += '<div style="padding:0 20px 16px;"><canvas id="chart" style="width:100%;height:420px;"></canvas></div></div>';

  // ---- Annual Table ----
  html += '<div class="table-container"><h3>📅 年度汇总</h3>';
  html += '<div style="overflow-x:auto;max-height:500px;overflow-y:auto;">';
  html += '<table><thead><tr>';
  html += '<th>年份</th><th>当年投入</th><th>累计投入</th><th>年末市值</th><th>当年市值变化</th>';
  html += '</tr></thead><tbody>';
  for (const row of result.annual) {
    const changeClass = row.change >= 0 ? 'color:#00c853;' : 'color:#ff1744;';
    html += '<tr>';
    html += '<td>' + row.year + '</td>';
    html += '<td>¥' + fmt(row.yearInvested) + '</td>';
    html += '<td>¥' + fmt(row.cumInvested) + '</td>';
    html += '<td>¥' + fmt(row.yearEndValue) + '</td>';
    html += '<td style="' + changeClass + '">¥' + fmt(row.change) + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table></div></div>';

  // ---- Transactions ----
  html += '<div class="table-container"><h3>📝 交易明细</h3>';
  const txCountEl = result.transactions.length;
  const txYears = new Set(result.transactions.map(t => t.month.slice(0, 4)));
  html += '<div style="padding:0 20px;font-size:13px;color:#888;">';
  html += '共 ' + txCountEl + ' 笔买入，覆盖 ' + txYears.size + ' 个年份';
  html += '</div>';

  if (txCountEl > 0) {
    html += '<details><summary>查看全部交易记录</summary>';
    html += '<div style="overflow-x:auto;max-height:400px;overflow-y:auto;">';
    html += '<table><thead><tr>';
    html += '<th>序号</th><th>月份</th><th>买入价</th><th>买入股数</th><th>买入金额</th>';
    html += '</tr></thead><tbody>';
    result.transactions.forEach((tx, i) => {
      html += '<tr>';
      html += '<td>' + (i + 1) + '</td>';
      html += '<td>' + tx.month + '</td>';
      html += '<td>$' + tx.price.toFixed(4) + '</td>';
      html += '<td>' + tx.shares + '</td>';
      html += '<td>$' + fmt(tx.amount) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div></details>';
  } else {
    html += '<div style="padding:0 20px 16px;font-size:13px;color:#888;">无交易记录（定投金额不足以购买 1 股）。</div>';
  }
  html += '</div>';

  // Render
  document.getElementById('results').innerHTML = html;

  // ---- Pure Canvas Chart (no CDN dependency) ----
  const monthly = result.monthly;
  const canvas = document.getElementById('chart');
  const container = canvas.parentElement;

  function drawChart() {
    const dpr = window.devicePixelRatio || 1;
    const rect = container.getBoundingClientRect();
    const W = rect.width;
    const H = 420; // fixed logical height
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const pad = { top: 16, right: 20, bottom: 48, left: 72 };
    const pw = W - pad.left - pad.right;
    const ph = H - pad.top - pad.bottom;

    // Y range: 0 to max * 1.05
    const allVals = [];
    monthly.forEach(m => { allVals.push(m.portfolioValue); allVals.push(m.totalInvested); });
    const yMax = Math.max(...allVals) * 1.05;

    const xOf = (i) => pad.left + (monthly.length === 1 ? pw / 2 : (i / (monthly.length - 1)) * pw);
    const yOf = (v) => pad.top + ph - (v / yMax) * ph;

    // Background
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);

    // Grid lines (5 horizontal)
    ctx.strokeStyle = '#e8e8e8';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    for (let g = 0; g <= 4; g++) {
      const yv = (yMax / 4) * g;
      const y = yOf(yv);
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
    }
    ctx.setLineDash([]);

    // Y-axis labels
    ctx.fillStyle = '#666';
    ctx.font = '11px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let g = 0; g <= 4; g++) {
      const yv = (yMax / 4) * g;
      ctx.fillText('¥' + (yv / 10000).toFixed(0) + '万', pad.left - 8, yOf(yv));
    }

    // X-axis labels (year markers for January)
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    let lastLabelX = -999;
    monthly.forEach((m, i) => {
      if (m.month.endsWith('-01')) {
        const x = xOf(i);
        if (x - lastLabelX > 50) {
          ctx.fillText(m.month.slice(0, 4), x, H - pad.bottom + 8);
          // tick mark
          ctx.strokeStyle = '#ccc';
          ctx.beginPath(); ctx.moveTo(x, pad.top + ph); ctx.lineTo(x, pad.top + ph + 4); ctx.stroke();
          lastLabelX = x;
        }
      }
    });

    // Axis lines
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.left, pad.top); ctx.lineTo(pad.left, pad.top + ph); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad.left, pad.top + ph); ctx.lineTo(W - pad.right, pad.top + ph); ctx.stroke();

    // ---- Draw "累计投入" line (dashed gray) ----
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 4]);
    ctx.beginPath();
    monthly.forEach((m, i) => {
      const x = xOf(i), y = yOf(m.totalInvested);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.setLineDash([]);

    // ---- Draw "持仓市值" line (blue) ----
    ctx.strokeStyle = '#2962FF';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    monthly.forEach((m, i) => {
      const x = xOf(i), y = yOf(m.portfolioValue);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Fill area under portfolio
    ctx.lineTo(xOf(monthly.length - 1), pad.top + ph);
    ctx.lineTo(xOf(0), pad.top + ph);
    ctx.closePath();
    ctx.fillStyle = 'rgba(41,98,255,0.06)';
    ctx.fill();

    // ---- Legend ----
    const lx = pad.left, ly = pad.top - 4;
    ctx.fillStyle = '#2962FF'; ctx.fillRect(lx, ly, 18, 3);
    ctx.fillStyle = '#333'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.font = '12px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('持仓市值', lx + 24, ly + 3);

    const lx2 = lx + 100;
    ctx.strokeStyle = '#999'; ctx.lineWidth = 2; ctx.setLineDash([6, 3]);
    ctx.beginPath(); ctx.moveTo(lx2, ly + 1.5); ctx.lineTo(lx2 + 18, ly + 1.5); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillText('累计投入', lx2 + 24, ly + 3);

    // ---- Hover/touch tooltip ----
    const tip = document.getElementById('chartTip') || (() => {
      const el = document.createElement('div');
      el.id = 'chartTip';
      el.style.cssText = 'position:absolute;background:rgba(0,0,0,0.78);color:#fff;padding:6px 10px;border-radius:4px;font-size:12px;pointer-events:none;display:none;white-space:nowrap;z-index:100;';
      container.appendChild(el);
      return el;
    })();

    function showTip(evt) {
      const cr = canvas.getBoundingClientRect();
      const mx = evt.clientX - cr.left;
      // Find closest data point
      let bestIdx = 0, bestDist = Infinity;
      monthly.forEach((m, i) => {
        const d = Math.abs(xOf(i) - mx);
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      });
      if (bestDist < 30) {
        const m = monthly[bestIdx];
        const sx = xOf(bestIdx), sy = yOf(m.portfolioValue);
        const tipX = Math.min(sx + 10, W - 140);
        const tipY = Math.max(sy - 44, 4);
        tip.style.display = 'block';
        tip.style.left = tipX + 'px';
        tip.style.top = tipY + 'px';
        tip.innerHTML = '<b>' + m.month + '</b><br>持仓市值：¥' + m.portfolioValue.toLocaleString('en-US', {maximumFractionDigits:0}) + '<br>累计投入：¥' + m.totalInvested.toLocaleString('en-US', {maximumFractionDigits:0});
      } else {
        tip.style.display = 'none';
      }
    }
    canvas.onmousemove = showTip;
    canvas.onmouseleave = () => tip.style.display = 'none';
    canvas.ontouchmove = (evt) => { evt.preventDefault(); showTip(evt.touches[0]); };
    canvas.ontouchend = () => { setTimeout(() => tip.style.display = 'none', 1500); };
  }

  drawChart();
  window.addEventListener('resize', drawChart);
}

function kpiCard(label, value, delta, deltaClass) {
  let html = '<div class="kpi-card">';
  html += '<div class="kpi-label">' + label + '</div>';
  html += '<div class="kpi-value">' + value + '</div>';
  if (delta) {
    html += '<div class="kpi-delta ' + (deltaClass || '') + '">' + delta + '</div>';
  }
  html += '</div>';
  return html;
}

// Init on load
initUI();
</script>
